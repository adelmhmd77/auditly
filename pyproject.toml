[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditly"
version = "1.0.0"
description = "Open-source technical SEO crawler and auditor with a desktop app, CLI and Claude-powered analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["httpx>=0.27", "lxml>=5.0", "cssselect>=1.2", "PySide6-Essentials>=6.7", "openpyxl>=3.1",
                "PyYAML>=6.0", "anthropic>=2.0"]

[project.optional-dependencies]
render = ["playwright>=1.45"]

[project.scripts]
auditly = "auditly.cli:main"

[project.gui-scripts]
auditly-gui = "auditly.ui.app:run"

[tool.setuptools.packages.find]
include = ["auditly*"]
